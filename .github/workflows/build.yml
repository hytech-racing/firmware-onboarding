name: Build & Test

# Since every trainee creates their own PlatformIO project under
# submissions/<username>/, this workflow doesn't know the project path
# ahead of time. Instead it looks at which files changed in the PR,
# finds the submission folder(s) touched, and builds/tests just those —
# so one person's PR never depends on anyone else's project existing or
# being valid.

on:
  pull_request:
    paths:
      - "submissions/**"

jobs:
  discover:
    name: Find changed submissions
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed submission project directories
        id: find
        run: |
          # Top-level submissions/<username>/ dirs touched by this PR,
          # limited to ones that actually contain a platformio.ini.
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^submissions/' \
            | awk -F/ '{print "submissions/"$2}' \
            | sort -u)

          dirs="[]"
          entries=()
          for d in $changed; do
            if [ -f "$d/platformio.ini" ]; then
              entries+=("\"$d\"")
            fi
          done
          if [ ${#entries[@]} -gt 0 ]; then
            dirs="[$(IFS=,; echo "${entries[*]}")]"
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Found project dirs: $dirs"

  build-and-test:
    name: Build + test submission
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project_dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        working-directory: ${{ matrix.project_dir }}
        # Don't assume a fixed environment name (e.g. "uno") — every
        # trainee's platformio.ini can name their hardware envs however
        # they want (uno_i2c/uno_spi, etc.), so this discovers whatever
        # [env:*] sections actually exist and builds each one. "native"
        # is skipped here on purpose: it's for `pio test`, not `pio
        # run` — building it as firmware would fail since it has no
        # main()/setup()/loop().
        run: |
          envs=$(grep -oE '^\[env:[^]]+\]' platformio.ini \
            | sed -E 's/^\[env:(.+)\]$/\1/' \
            | grep -v '^native$')

          if [ -z "$envs" ]; then
            echo "No non-native [env:*] sections found in platformio.ini"
            exit 1
          fi

          for e in $envs; do
            echo "Building environment: $e"
            pio run -e "$e"
          done

      - name: Run native tests (if present)
        working-directory: ${{ matrix.project_dir }}
        run: |
          if grep -q "env:native" platformio.ini 2>/dev/null; then
            pio test -e native
          else
            echo "No [env:native] found — skipping (native tests are a stretch goal, see TASK.md)"
          fi

  # GitHub's required-status-checks feature needs one fixed check name
  # to require — but build-and-test's name changes per matrix value
  # (e.g. "Build + test submission (submissions/alice)"), since that's
  # how matrix jobs report their status. A required check locked to
  # one specific matrix value would only ever pass for that one
  # person's submission path, permanently blocking everyone else's
  # PRs. This job always has the same name no matter what the matrix
  # contained, so THIS is the one to mark as required in the ruleset.
  all-builds-passed:
    name: All builds passed
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "One or more submission builds failed."
            exit 1
          fi
          echo "All submission builds succeeded."
